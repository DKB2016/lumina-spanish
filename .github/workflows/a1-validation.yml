name: Lumina A1 validation
on:
  push:
    branches: [main, feature/interactive-a1-curriculum]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumina-spanish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lumina-spanish/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lumina-preview.log 2>&1 &
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          node tests/browser-smoke.mjs
