name: React CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumina-spanish
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lumina-spanish/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate lesson data syntax
        run: node --check src/data.js
      - name: Build React app
        run: npm run build
